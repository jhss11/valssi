<h2 class="titulo">Reseñas</h2>
<h3 class="subtitulo">Historial de reseñas</h3>
<div class="reviews-container">
  <div class="tarjetas-grid">
    @if(datos){ @for(data of datos; track data.id){
    <mat-card class="tarjeta-review"> 
        <div class="fecha">{{ getFechaEnEspanol(data.date)}}</div>

      <div class="contenido">
        <p class="usuario" >Usuario: {{ data.user.username }}</p>
        <p>Producto: {{ data.product.name }}</p>

        <div class="estrellas">
          <ng-container *ngFor="let i of [1, 2, 3, 4, 5]">
            <mat-icon color="primary">
              {{ i <= data.rating ? 'star' : 'star_border' }}
            </mat-icon>
          </ng-container>
          <span class="promedio">({{ data.rating.toFixed(1) }})</span>
        </div>

       <div class="btn-contenedor">
              <button mat-flat-button color="primary" (click)="verDetalle(data.id)">Ver detalle</button>
            </div>
      </div>
    </mat-card>
    } }
  </div>
</div>
