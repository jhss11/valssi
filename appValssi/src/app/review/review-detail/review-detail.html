<div class="review-detail">
  <div class="cabecera">
    <h3 class="usuario">{{ datos.user.username }}</h3>
    <span class="fecha">{{ datos.date | date:'dd/MM/yyyy' }}</span>
  </div>

  

  <div class="producto">
    <span>Producto:</span>
    <span class="etiqueta">{{ datos.product.name }}</span>
  </div>

  <div class="rating">
    <div class="estrellas">
      <ng-container *ngFor="let i of [1,2,3,4,5]">
        <mat-icon>
          {{ i <= datos.rating ? 'star' : 'star_border' }}
        </mat-icon>
      </ng-container>
    </div>
    <span class="valor">{{ datos.rating.toFixed(1) }}</span>
  </div>

  <p class="comentario">{{ datos.description }}</p>

  <hr class="divisor" />
</div>
<div class="boton-centro">
  <button mat-flat-button (click)="goBack()">Volver al listado de reseñas</button>
</div>
