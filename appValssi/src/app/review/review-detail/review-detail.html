<div class="boton">
  <button mat-flat-button (click)="goBack()"> <mat-icon>arrow_back</mat-icon>Regresar</button>
</div>
<div class="review-detail">
  <div class="cabecera">
    <h3 class="usuario">{{ datos.user.username }}</h3>
    
  </div>

  
<span class="fecha">Fecha de publicación: {{ getFechaEnEspanol(datos.date) }}</span>
  <div class="producto">
    <span>Producto:</span>
    <span class="etiqueta">{{ datos.product.name }}</span>
  </div>

  <div class="rating">
    <div class="estrellas">
      <ng-container *ngFor="let i of [1,2,3,4,5]">
        <mat-icon>
          {{ i <= datos.rating ? 'star' : 'star_border' }}
        </mat-icon>
      </ng-container>
    </div>
    <span class="valor">{{ datos.rating.toFixed(1) }}</span>
  </div>

  <p class="comentario">{{ datos.description }}</p>

  <hr class="divisor" />
</div>
