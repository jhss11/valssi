<form [formGroup]="productForm" (ngSubmit)="submitProduct()" novalidate>
  <h2>{{ titleForm }} Producto</h2>
<input type="hidden" formControlName="id" />


  <div class="field">
    <label for="name">Nombre del Producto</label>
    <input id="name" type="text" formControlName="name" />
  </div>

  <div class="field">
    <label for="description">Descripción</label>
    <input id="description" type="text" formControlName="description" />
  </div>

  <div class="field">
    <label for="price">Precio</label>
    <input id="price" type="number" formControlName="price" />
  </div>

  <div class="field">
    <label for="stock">Stock</label>
    <input id="stock" type="number" formControlName="stock" />
  </div>

  <div class="field">
    <label for="categ">Categoría</label>
    <select id="category" formControlName="categoryId">
      <option *ngFor="let cat of categorias" [value]="cat.id">{{ cat.name }}</option>
    </select>
  </div>

  <div class="field">
    <label for="tags">Etiquetas</label>
    <select id="tags" formControlName="tags" multiple>
@for (item of tags; track item.id) {
                            <option [value]="item.id">
                                {{item.name}}
                            </option>
                            }

    </select>
  </div>

  <!-- <fieldset>
    <legend>Imágenes del producto</legend>
    <input type="file" (change)="onFileChange($event)" multiple accept="image/*" />
    <div *ngIf="previewUrls.length">
      <img *ngFor="let url of previewUrls" [src]="url" height="100" style="margin: 0.5rem" />
    </div>
  </fieldset> -->

  <div class="actions">
    <button type="submit">Guardar</button>
    <button type="button" (click)="onReset()">Limpiar</button>
    <button type="button" (click)="onBack()">Regresar</button>
  </div>
</form>
