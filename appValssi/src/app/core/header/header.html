
<mat-toolbar color="primary" class="header">
  <!-- <button matIconButton class="example-header-image" matTooltip="AppVideojuegos"></button> -->
  <button [matMenuTriggerFor]="menu1" matIconButton class="example-icon" matTooltip="Menu">
    <mat-icon>menu</mat-icon>
  </button>
   
  
  <img class="logo" src="/images/logoUltimaVersion.png" alt="Logo Valssi" />

  <span class="example-spacer2"></span>

  <!-- MANTENIMIENTO -->
<span class="menu-text" [matMenuTriggerFor]="menu2" matTooltip="Mantenimientos">Mantenimiento</span>
<mat-menu #menu2="matMenu">
    <button mat-menu-item [routerLink]="['/product']" routerLinkActive="active-link">Productos</button>
  <button mat-menu-item [routerLink]="['/promotion']" routerLinkActive="active-link">Promociones</button>
</mat-menu>

<!-- REPORTES -->
  <span class="menu-text" [matMenuTriggerFor]="menu4" matTooltip="Reportes">Reportes</span>
<mat-menu #menu4="matMenu">
  <button mat-menu-item [routerLink]="['/promotion']" routerLinkActive="active-link">Opción de reporte 1</button>
  <button mat-menu-item>Opción de reporte 2</button>
</mat-menu>

<span class="menu-text" [matMenuTriggerFor]="menu5" matTooltip="Listados">Listados</span>
<mat-menu #menu5="matMenu">
  <button mat-menu-item [routerLink]="['/review']" routerLinkActive="active-link">Reseñas</button>
    
    <button mat-menu-item [routerLink]="['/order']" routerLinkActive="active-link">Pedidos</button>
</mat-menu>

  <div class="example-spacer2"></div>


  <mat-menu #menu1="matMenu">
    <button mat-menu-item [routerLink]="['/inicio']" routerLinkActive="active-link">Inicio</button>
    <button mat-menu-item [routerLink]="['/aboutus']" routerLinkActive="active-link">Acerca de</button>
    <button mat-menu-item [routerLink]="['/product/list']" routerLinkActive="active-link">Productos</button>
    
  </mat-menu>


    <button matIconButton matBadgeColor="accent" [matBadge]="qtyItems.toString()" class="small-text">
      <mat-icon [ngClass]="isAutenticated ? 'cart': ''">shopping_cart</mat-icon>
    </button>
    <!-- Menu de Usuario-->
    <!-- <span class="small-text">{{ currentUser?.email}}</span> -->
    <button matIconButton [matMenuTriggerFor]="menu3">
      <mat-icon [ngStyle]="{'color':isAutenticated ? '#ffffff':'#9ab0aa'}">person</mat-icon>
    </button>
    <mat-menu #menu3="matMenu">
      @if(!isAutenticated){
        <button mat-menu-item>
          <mat-icon>person_add</mat-icon>
          <span>Login</span>
        </button>
      }@else {
        <button mat-menu-item>
          <mat-icon>person_remove</mat-icon>
          <span>Logout</span>
        </button>
      }
    </mat-menu>
</mat-toolbar>
