<div class="login-container">
  <mat-card class="login-card">
    <mat-card-title>Inicio de sesión</mat-card-title>
    <mat-card-content>
      <form [formGroup]="formulario" (ngSubmit)="submitForm()">

        <!-- Email -->
        <mat-form-field  floatLabel="auto" hideRequiredMarker="true">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="emaillogin" placeholder="usuario@correo.com"  style="font-weight: 400"/>
          @if(errorHandling('emaillogin')) {
            <mat-error style="color: firebrick;">{{ errorHandling('emaillogin') }}</mat-error>
          }
        </mat-form-field>

        <!-- Password -->
        <mat-form-field floatLabel="auto" hideRequiredMarker="true">
          <mat-label>Contraseña</mat-label>
          <input matInput [type]="hide ? 'password' : 'text'" formControlName="passwordlogin" />
          <button mat-icon-button matSuffix type="button" (click)="hide = !hide">
            <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          @if(errorHandling('passwordlogin')) {
            <mat-error style="color: firebrick;">{{ errorHandling('passwordlogin') }}</mat-error>
          }
        </mat-form-field>

        <!-- Botones -->
        <div class="actions">
          <button mat-flat-button color="primary" type="submit">Ingresar</button>
          <button mat-stroked-button color="warn" type="button" (click)="onReset()">Limpiar</button>
        </div>

      </form>
    </mat-card-content>
  </mat-card>
</div>
