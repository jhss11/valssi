<button mat-icon-button class="close-button" (click)="cancel()">
  <mat-icon class="close-icon">close</mat-icon>
</button>

<div class="password-container">
  <h2>{{ 'Cambiar Contraseña' }}</h2>

  <form [formGroup]="passwordForm" (ngSubmit)="submit()">

    <mat-form-field appearance="fill">
      <mat-label>Contraseña actual</mat-label>
      <input matInput type="password" formControlName="currentPassword" />
      <mat-error *ngIf="errorHandling('currentPassword')">{{ errorHandling('currentPassword') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Nueva contraseña</mat-label>
      <input matInput type="password" formControlName="newPassword" />
      <mat-error *ngIf="errorHandling('newPassword')">{{ errorHandling('newPassword') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Confirmar nueva contraseña</mat-label>
      <input matInput type="password" formControlName="confirmPassword" />
      <mat-error *ngIf="passwordForm.hasError('mismatch')">Las contraseñas no coinciden</mat-error>
    </mat-form-field>

    <div class="actions">
      <button mat-stroked-button type="button" (click)="cancel()">Cancelar</button>
      <button mat-stroked-button color="primary" type="submit" [disabled]="passwordForm.invalid">Actualizar</button>
    </div>
  </form>
</div>
